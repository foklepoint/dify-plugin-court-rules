[project]
name = "dify-plugin-court-rules"
version = "0.0.1"
description = "Dify tool plugin for the Court Rules API: court rules, judge standing orders and court holidays."
requires-python = ">=3.12"
dependencies = [
    "dify_plugin>=0.9.0,<0.10.0",
    "requests>=2.33.1,<3",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
